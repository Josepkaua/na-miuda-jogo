name: Validate discussion refinement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  refine-and-verify:
    if: github.head_ref == 'refino-identidade'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refino-identidade
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply discussion refinements
        run: node scripts/refine-discussion-ci.mjs

      - name: Install dependencies
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Visual browser checks
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/na-miuda-vite.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null || { cat /tmp/na-miuda-vite.log; exit 1; }
          cat > visual-check.mjs <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';

          await mkdir('visual-artifacts', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const sizes = [
            ['desktop-1920', 1920, 1080],
            ['desktop-1366', 1366, 768],
            ['tablet-820', 820, 1180],
            ['mobile-390', 390, 844],
            ['mobile-360', 360, 800],
            ['mobile-320', 320, 568],
          ];

          for (const [name, width, height] of sizes) {
            const page = await browser.newPage({ viewport: { width, height } });
            const consoleErrors = [];
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            page.on('pageerror', error => consoleErrors.push(error.message));
            await page.clock.install({ time: new Date('2026-08-24T02:30:00Z') });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.getByLabel('Seu apelido').fill('Teste Visual');
            await page.getByRole('button', { name: /Criar sala e chamar a turma/i }).click();
            await page.getByRole('button', { name: /Marcar como pronto/i }).click();
            await page.getByRole('button', { name: /Sortear e começar/i }).click();
            await page.getByRole('button', { name: /Toque para revelar/i }).click();
            await page.getByRole('button', { name: /Todos viram\? Começar pistas/i }).click();

            const composer = page.getByLabel('Mensagem para o chat da sala');
            if (!(await composer.isVisible())) throw new Error(`${name}: composer hidden in empty chat`);
            for (let i = 0; i < 2; i += 1) {
              await composer.fill(`Mensagem curta ${i + 1}.`);
              await composer.press('Enter');
            }
            if (!(await composer.isVisible())) throw new Error(`${name}: composer hidden with few messages`);
            for (let i = 0; i < 28; i += 1) {
              await composer.fill(`Mensagem de teste ${i + 1} para validar rolagem interna do chat.`);
              await composer.press('Enter');
            }

            await page.evaluate(() => {
              const list = document.querySelector('.player-list');
              const row = list?.querySelector('.player-row');
              if (!list || !row) return;
              for (let i = 0; i < 20; i += 1) {
                const clone = row.cloneNode(true);
                clone.querySelector('.player-name strong').textContent = `Jogador extra ${i + 1}`;
                list.appendChild(clone);
              }
            });

            const metrics = await page.evaluate(() => {
              const chat = document.querySelector('.chat-panel');
              const messages = document.querySelector('.chat-messages');
              const composer = document.querySelector('.chat-composer');
              const players = document.querySelector('.players-panel');
              const playerList = document.querySelector('.player-list');
              const main = document.querySelector('.main-panel');
              const footer = document.querySelector('footer');
              const style = (el) => el ? getComputedStyle(el) : null;
              return {
                horizontalOverflow: document.documentElement.scrollWidth - window.innerWidth,
                chatOverflow: style(messages)?.overflowY,
                chatScrollable: messages ? messages.scrollHeight > messages.clientHeight : false,
                playersOverflow: style(players)?.overflowY,
                playerListOverflow: style(playerList)?.overflowY,
                playerListScrollable: playerList ? playerList.scrollHeight > playerList.clientHeight : false,
                mainOverflow: style(main)?.overflowY,
                composerInsideChat: chat && composer ? composer.getBoundingClientRect().bottom <= chat.getBoundingClientRect().bottom + 1 : false,
                footerClear: footer && players ? footer.getBoundingClientRect().top >= players.getBoundingClientRect().bottom - 1 : true,
              };
            });
            if (metrics.horizontalOverflow > 1) throw new Error(`${name}: horizontal overflow ${metrics.horizontalOverflow}`);
            if (!['auto', 'scroll'].includes(metrics.chatOverflow)) throw new Error(`${name}: chat messages are not the scroll area`);
            if (!metrics.chatScrollable) throw new Error(`${name}: long chat did not become scrollable`);
            if (metrics.playersOverflow === 'auto' || metrics.playersOverflow === 'scroll') throw new Error(`${name}: whole players panel scrolls`);
            if (!['auto', 'scroll'].includes(metrics.playerListOverflow)) throw new Error(`${name}: player list is not isolated scroll area`);
            if (!metrics.playerListScrollable) throw new Error(`${name}: long player list did not become scrollable`);
            if (metrics.mainOverflow === 'auto' || metrics.mainOverflow === 'scroll') throw new Error(`${name}: timer/info panel scrolls internally`);
            if (!metrics.composerInsideChat) throw new Error(`${name}: composer escaped chat panel`);
            if (!metrics.footerClear) throw new Error(`${name}: footer overlaps players panel`);

            await page.screenshot({ path: `visual-artifacts/${name}-light.png`, fullPage: true });
            await page.evaluate(() => { document.documentElement.dataset.theme = 'dark'; localStorage.setItem('na-miuda-theme', 'dark'); });
            await page.screenshot({ path: `visual-artifacts/${name}-dark.png`, fullPage: true });

            await page.clock.fastForward('03:01');
            await page.getByRole('heading', { name: /Mais tempo ou votação\?/i }).waitFor();
            if (!(await composer.isDisabled())) throw new Error(`${name}: composer remains enabled during collective decision`);
            await page.getByRole('button', { name: /Mais tempo/i }).click();
            await page.getByRole('heading', { name: /Discussão ao vivo/i }).waitFor();
            if (await composer.isDisabled()) throw new Error(`${name}: composer did not reopen after more time`);
            await page.clock.fastForward('01:01');
            await page.getByRole('heading', { name: /Mais tempo ou votação\?/i }).waitFor();
            await page.getByRole('button', { name: /Ir para votação/i }).click();
            await page.getByRole('heading', { name: /Quem está na miúda\?/i }).waitFor();
            await page.getByText('Tempo encerrado — abrindo a votação…').waitFor();
            if (consoleErrors.length) throw new Error(`${name}: console errors: ${consoleErrors.join(' | ')}`);
            await page.close();
          }
          await browser.close();
          NODE
          node visual-check.mjs
          git restore package.json package-lock.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: discussion-visual-checks
          path: visual-artifacts/*.png
          if-no-files-found: error

      - name: Commit verified changes
        shell: bash
        run: |
          rm -f visual-check.mjs
          rm -rf visual-artifacts
          rm -f .github/workflows/refine-discussion.yml
          rm -f .github/workflows/refine-discussion-pr.yml
          rm -f scripts/refine-discussion-ci.mjs
          git config user.name "José Kauã Silva Praseres"
          git config user.email "kauapraseres56@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Refinar discussão responsiva e decisão coletiva"
          git push origin HEAD:refino-identidade
