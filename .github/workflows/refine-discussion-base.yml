name: Validate discussion from base branch

on:
  pull_request:
    branches:
      - refino-identidade

permissions:
  contents: write
  pull-requests: read

jobs:
  refine-and-verify:
    if: github.head_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refino-identidade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Refine and validate discussion
        run: bash scripts/validate-discussion-ci.sh
